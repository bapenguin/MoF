name: Build

# Builds the game on every push and attaches the ready-to-upload site as a
# downloadable artifact ("mof-web") on the workflow run page.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Converted assets in public/assets and data/ are committed, so CI
      # doesn't need the raw legacy media or ffmpeg.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mof-web
          path: dist
          retention-days: 30
