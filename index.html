<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Massacre of the Fairies</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #game {
        position: absolute;
        cursor: crosshair;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #fullscreen {
        position: fixed;
        right: 6px;
        bottom: 6px;
        z-index: 5;
        width: 34px;
        height: 34px;
        padding: 0;
        font-size: 20px;
        line-height: 1;
        color: #cfc;
        background: rgba(0, 40, 0, 0.6);
        border: 1px solid rgba(160, 255, 160, 0.4);
        border-radius: 4px;
        cursor: pointer;
        opacity: 0.5;
      }
      #fullscreen:hover {
        opacity: 1;
      }
      /* The game is 4:3 landscape; on a phone held upright it would be tiny. */
      #rotate {
        display: none;
      }
      @media (orientation: portrait) and (max-width: 700px) {
        #rotate {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 10;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          background: rgba(0, 0, 0, 0.88);
          color: #8f8;
          font: bold 20px Arial, sans-serif;
          text-align: center;
          padding: 24px;
        }
        #rotate span {
          font-size: 56px;
        }
      }
      /* Menu layer: laid out in the original's 1024x768 pixels, scaled to fit. */
      #ui {
        position: absolute;
        width: 1024px;
        height: 768px;
        transform-origin: 0 0;
        pointer-events: none;
        font-family: Arial, Helvetica, sans-serif;
        user-select: none;
      }
      #ui > * {
        pointer-events: auto;
      }
      #ui .abs {
        position: absolute;
      }
      #ui .panel {
        position: absolute;
        background-repeat: no-repeat;
        overflow: hidden;
      }
      #ui .link {
        position: absolute;
        cursor: pointer;
        text-align: center;
        white-space: nowrap;
      }
      #ui .link.disabled {
        cursor: default;
        opacity: 0.45;
      }
      /* VB command buttons, Windows 98 style. */
      #ui button {
        position: absolute;
        font: 13px Tahoma, 'MS Sans Serif', Arial, sans-serif;
        color: #000;
        background: #d4d0c8;
        border: 2px outset #fff;
        padding: 0;
        cursor: pointer;
      }
      #ui button:active {
        border-style: inset;
      }
      #ui input[type='text'] {
        position: absolute;
        font: 15px Arial, sans-serif;
        border: 2px inset #fff;
        padding: 1px 4px;
        box-sizing: border-box;
      }
      #ui label.check {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 4px;
        font: 13px Tahoma, 'MS Sans Serif', Arial, sans-serif;
        color: #fff;
        background: rgb(128, 64, 0);
        cursor: pointer;
      }
      /* VB ListBoxes */
      #ui select {
        position: absolute;
        font: 13px Tahoma, 'MS Sans Serif', Arial, sans-serif;
        border: 2px inset #fff;
        background: #fff;
        box-sizing: border-box;
      }
      #ui input:disabled {
        background: #d4d0c8;
      }
      #ui .list {
        position: absolute;
        overflow-y: auto;
        font: 14px 'Courier New', monospace;
        white-space: pre;
        padding: 4px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1024" height="768"></canvas>
    <div id="ui"></div>
    <button id="fullscreen" title="Fullscreen (F)" aria-label="Toggle fullscreen">⛶</button>
    <div id="rotate"><span>⟳</span>Turn your phone sideways to massacre fairies</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
