<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Massacre of the Fairies</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#003300" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #game {
        position: absolute;
        cursor: crosshair;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #fullscreen {
        position: fixed;
        right: 6px;
        bottom: 6px;
        z-index: 5;
        width: 34px;
        height: 34px;
        padding: 0;
        font-size: 20px;
        line-height: 1;
        color: #cfc;
        background: rgba(0, 40, 0, 0.6);
        border: 1px solid rgba(160, 255, 160, 0.4);
        border-radius: 4px;
        cursor: pointer;
        opacity: 0.5;
      }
      #fullscreen:hover {
        opacity: 1;
      }
      #install {
        position: fixed;
        right: 46px;
        bottom: 6px;
        z-index: 5;
        height: 34px;
        padding: 0 12px;
        font: bold 13px Arial, sans-serif;
        color: #cfc;
        background: rgba(0, 40, 0, 0.75);
        border: 1px solid rgba(160, 255, 160, 0.5);
        border-radius: 4px;
        cursor: pointer;
      }
      #install[hidden] {
        display: none;
      }
      /* The game is 4:3 landscape; on a phone held upright it would be tiny. */
      #rotate {
        display: none;
      }
      @media (orientation: portrait) and (max-width: 700px) {
        #rotate {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 10;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          background: rgba(0, 0, 0, 0.88);
          color: #8f8;
          font: bold 20px Arial, sans-serif;
          text-align: center;
          padding: 24px;
        }
        #rotate span {
          font-size: 56px;
        }
      }
      /* Menu layer: laid out in the original's 1024x768 pixels, scaled to fit. */
      #ui {
        position: absolute;
        width: 1024px;
        height: 768px;
        transform-origin: 0 0;
        pointer-events: none;
        font-family: Arial, Helvetica, sans-serif;
        user-select: none;
      }
      #ui > * {
        pointer-events: auto;
      }
      #ui .abs {
        position: absolute;
      }
      #ui .panel {
        position: absolute;
        background-repeat: no-repeat;
        overflow: hidden;
      }
      #ui .link {
        position: absolute;
        cursor: pointer;
        text-align: center;
        white-space: nowrap;
      }
      #ui .link.disabled {
        cursor: default;
        opacity: 0.45;
      }
      /* VB command buttons, Windows 98 style. */
      #ui button {
        position: absolute;
        font: 13px Tahoma, 'MS Sans Serif', Arial, sans-serif;
        color: #000;
        background: #d4d0c8;
        border: 2px outset #fff;
        padding: 0;
        cursor: pointer;
      }
      #ui button:active {
        border-style: inset;
      }
      #ui input[type='text'] {
        position: absolute;
        font: 15px Arial, sans-serif;
        border: 2px inset #fff;
        padding: 1px 4px;
        box-sizing: border-box;
      }
      #ui label.check {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 4px;
        font: 13px Tahoma, 'MS Sans Serif', Arial, sans-serif;
        color: #fff;
        background: rgb(128, 64, 0);
        cursor: pointer;
      }
      /* VB ListBoxes */
      #ui select {
        position: absolute;
        font: 13px Tahoma, 'MS Sans Serif', Arial, sans-serif;
        border: 2px inset #fff;
        background: #fff;
        box-sizing: border-box;
      }
      #ui input:disabled {
        background: #d4d0c8;
      }
      #ui .list {
        position: absolute;
        overflow-y: auto;
        font: 14px 'Courier New', monospace;
        white-space: pre;
        padding: 4px;
        box-sizing: border-box;
      }
      /* Touch rails beside the game on phones/tablets (src/ui/rails.ts). Real CSS px. */
      body.has-rails #fullscreen,
      body.has-rails #install {
        display: none;
      }
      .rail {
        position: fixed;
        z-index: 4;
        box-sizing: border-box;
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-family: Arial, Helvetica, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
        transition: opacity 0.2s;
      }
      .rail.inactive {
        opacity: 0.45;
      }
      .rail button {
        font: inherit;
        color: #cfc;
        background: rgba(0, 40, 0, 0.85);
        border: 1px solid rgba(160, 255, 160, 0.35);
        border-radius: 8px;
        padding: 0;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .rail button:active {
        background: rgba(40, 110, 40, 0.95);
      }
      .rail-left {
        align-items: stretch;
      }
      .rail-pause {
        flex: 0 0 48px;
        font-size: 18px !important;
      }
      .rail-full {
        flex: 0 0 40px;
        margin-top: auto;
        font-size: 20px !important;
        opacity: 0.7;
      }
      .rail-stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1.1;
        padding: 4px 2px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.35);
      }
      .rail-stat span {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #8c8;
      }
      .rail-stat b {
        font-size: 20px;
        color: rgb(240, 242, 86);
        font-variant-numeric: tabular-nums;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rail-right {
        display: grid;
        grid-template-columns: 1fr;
        grid-auto-rows: 1fr;
      }
      .rail-right.two-col {
        grid-template-columns: 1fr 1fr;
      }
      .rail-weapon {
        --cd: 0;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-height: 0;
        overflow: hidden;
      }
      /* Reload sweep, like the HUD weapon box's. */
      .rail-weapon::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: conic-gradient(rgba(0, 0, 0, 0.6) calc(var(--cd) * 360deg), transparent 0);
      }
      .rail-right.two-col .rail-weapon {
        flex-direction: column;
        gap: 0;
      }
      .rail-weapon img {
        height: min(34px, 80%);
        aspect-ratio: 1;
        border-radius: 4px;
      }
      .rail-weapon .num {
        position: absolute;
        top: 1px;
        left: 4px;
        font-size: 10px;
        color: #8c8;
      }
      .rail-weapon .ammo {
        font-size: 13px;
        font-weight: bold;
        color: rgb(240, 242, 86);
        font-variant-numeric: tabular-nums;
      }
      .rail-weapon.selected {
        border: 2px solid rgb(240, 242, 86);
        background: rgba(60, 90, 0, 0.9);
      }
      .rail-weapon.empty {
        opacity: 0.35;
      }
      .rail-weapon.empty .ammo {
        color: #f88;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1024" height="768"></canvas>
    <div id="ui"></div>
    <button id="fullscreen" title="Fullscreen (F)" aria-label="Toggle fullscreen">⛶</button>
    <button id="install" title="Install the game on this device" hidden>Install</button>
    <div id="rotate"><span>⟳</span>Turn your phone sideways to massacre fairies</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
